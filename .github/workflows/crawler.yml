name: Research crawler

# Ръчно пускане, без планировчик (т. 1 от спецификацията).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Идентификатор на пускането (напр. 2026-q3)'
        required: true
      targets:
        description: 'Път до targets CSV в repo-то'
        required: true
        default: 'crawler/targets.sample.csv'
      notes:
        description: 'Бележки за пускането (по избор)'
        required: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Конфигурацията за R2 живее в environment „production". Без този ключ
    # environment secrets/variables НЕ се виждат от job-а и всички стойности
    # излизат празни.
    environment: production
    # Данните са трайни в Cloudflare R2 — базата и артефактите се възстановяват
    # в началото и се качват обратно накрая, за да натрупват между тримесечията.
    # Нищо чувствително в кода. `||` приема стойността и като Variable, и като
    # Secret — освен тайния ключ, който трябва да е Secret (Variables не се
    # маскират в логовете).
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || vars.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      # Проверява дали R2 е конфигуриран. Ако липсва нещо — казва точно какво
      # и продължава без трайно съхранение (пускането пак дава CSV като
      # артефакт), вместо да залива лога с „Invalid endpoint".
      - name: Check R2 configuration
        id: r2check
        run: |
          missing=""
          [ -n "$R2_BUCKET" ]             || missing="$missing R2_BUCKET"
          [ -n "$R2_ACCOUNT_ID" ]         || missing="$missing R2_ACCOUNT_ID"
          [ -n "$AWS_ACCESS_KEY_ID" ]     || missing="$missing R2_ACCESS_KEY_ID"
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing="$missing R2_SECRET_ACCESS_KEY(само като Secret — Variables не се маскират в логовете)"
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=R2 не е конфигуриран::Липсват:$missing — очакват се в environment „production\" (Settings → Environments → production). Пускането пак дава CSV като артефакт, но без трайно съхранение."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "AWS_ENDPOINT_URL=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
            echo "R2 е конфигуриран: bucket=$R2_BUCKET"
          fi

      # Възстановяваме базата (натрупва между пусканията) и — ако този run_id
      # вече е започнат — артефактите му, за да може collect да продължи.
      - name: Restore state from R2
        if: steps.r2check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p crawler/artifacts crawler/exports
          aws s3 cp "s3://$R2_BUCKET/crawler.db" crawler/crawler.db \
            --endpoint-url "$AWS_ENDPOINT_URL" || echo "Няма съществуваща база — започваме на чисто."
          aws s3 sync "s3://$R2_BUCKET/artifacts/${{ inputs.run_id }}/" "crawler/artifacts/${{ inputs.run_id }}/" \
            --endpoint-url "$AWS_ENDPOINT_URL" || true

      - name: Collect
        env:
          # По избор: даде ли се секрет, collect добавя PageSpeed метрики.
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: npm run crawl -w @kova/crawler -- --targets "${{ inputs.targets }}" --run-id "${{ inputs.run_id }}" --notes "${{ inputs.notes }}"

      # Базата се качва дори при провал на collect, за да не се губи напредък.
      - name: Persist database to R2
        if: always() && steps.r2check.outputs.enabled == 'true'
        run: |
          test -f crawler/crawler.db && aws s3 cp crawler/crawler.db "s3://$R2_BUCKET/crawler.db" \
            --endpoint-url "$AWS_ENDPOINT_URL" || echo "Няма база за качване."

      - name: Derive
        run: npm run derive -w @kova/crawler -- --run-id "${{ inputs.run_id }}"

      - name: Export CSV
        run: npm run export -w @kova/crawler -- --run-id "${{ inputs.run_id }}"

      # Артефактите (за re-derive по-късно), обновената база и CSV-то → R2.
      - name: Persist artifacts and export to R2
        if: always() && steps.r2check.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          aws s3 cp crawler/crawler.db "s3://$R2_BUCKET/crawler.db" --endpoint-url "$AWS_ENDPOINT_URL" || true
          aws s3 sync crawler/artifacts/ "s3://$R2_BUCKET/artifacts/" --endpoint-url "$AWS_ENDPOINT_URL" || true
          aws s3 sync crawler/exports/ "s3://$R2_BUCKET/exports/" --endpoint-url "$AWS_ENDPOINT_URL" || true

      # Освен в R2, CSV-то и базата се качват и като артефакт на run-а —
      # удобно за бърз преглед без R2 клиент.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ inputs.run_id }}
          path: |
            crawler/crawler.db
            crawler/exports/
          retention-days: 30
